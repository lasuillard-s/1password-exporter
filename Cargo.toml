[package]
name = "onepassword-exporter"
version = "0.5.2"
edition = "2021"

[dependencies]
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
lazy_static = "=1.5.0"
log = "=0.4.34"
prometheus = "=0.14.0"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
simplelog = "=0.12.2"
tokio = { version = "=1.53.1", features = ["full"] }

[dev-dependencies]
anyhow = "=1.0.104"
assert_cmd = "=2.2.2"
mockall = "=0.15.0"
reqwest = "=0.13.5"
rstest = "=0.27.0"
